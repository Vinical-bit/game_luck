<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luck's Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="cab">
  <header>
    <h1>LUCK'S <span>ARCADE</span></h1>
    <button id="mute" aria-label="Ligar ou desligar o som">SOM ON</button>
  </header>

  <div class="hud">
    <div class="cell"><b>ÂNIMO</b><div class="bar"><i id="bar"></i></div></div>
    <div class="cell"><b>PONTOS</b><div class="v" id="score">0000</div></div>
    <div class="cell"><b>NÍVEL</b><div class="v" id="lvl">1</div></div>
  </div>

  <div class="pad">
    <div class="stage" id="stage">
      <canvas id="cv" width="180" height="216" aria-label="Luck em pixel art, sentado e abanando o rabo"></canvas>
      <div class="scan"></div>
      <div class="start" id="start">
        <div class="big">LUCK'S<br>ARCADE</div>
        <div class="sub">O Luck passou aqui pra te fazer companhia.</div>
        <div class="go">&gt; TOQUE PRA COMEÇAR &lt;</div>
      </div>
    </div>
  </div>

  <div class="dlg"><div class="who">LUCK</div><span id="txt"></span></div>

  <div class="btns">
    <button id="bPet">CARINHO</button>
    <button id="bTreat">PETISCO</button>
    <button id="bPlay">JOGAR</button>
    <button id="bBark">LATIR</button>
  </div>
  <footer>feito pelo Vinical<br>dica: arrasta o dedo no Luck pra fazer cafuné</footer>
</div>

<script src="script.js"></script>
</body>
</html>
